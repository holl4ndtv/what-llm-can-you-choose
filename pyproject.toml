[project]
name = "what-llm-can-you-choose"
version = "0.1.0"
description = "Find the best AI model your computer can run, explained in plain words. Based on whichllm by Andyyyy64."
authors = [{name = "Yauhen Massalski"}, {name = "Andyyyy64"}]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["llm", "local-llm", "gpu", "vram", "huggingface", "inference", "hardware", "cli", "recommendation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "httpx>=0.27",
    "psutil>=5.9",
    "dbgpu[fuzz]>=1.0",
    "nvidia-ml-py>=12.0",
]

[project.urls]
Homepage = "https://github.com/holl4ndtv/what-llm-can-you-choose"
Repository = "https://github.com/holl4ndtv/what-llm-can-you-choose"
"Bug Tracker" = "https://github.com/holl4ndtv/what-llm-can-you-choose/issues"
"Based on" = "https://github.com/Andyyyy64/whichllm"

[project.scripts]
what-llm-can-you-choose = "whichllm.cli:app"
whichllm = "whichllm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whichllm"]

[tool.uv]
required-version = "==0.11.33"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyarrow>=23.0.1",
    "pytest>=8.0",
    "ruff==0.15.22",
]
